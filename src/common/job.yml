resources:
  jobs:
    fhir_lakehouse_pipeline:
      name: fhir_lakehouse_pipeline
      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Users/mohitag9040@gmail.com/fhir-lakehouse/src/notebooks/setup.py
            source: WORKSPACE
        - task_key: raw_patient
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: /Workspace/Users/mohitag9040@gmail.com/fhir-lakehouse/src/notebooks/01_raw_ingestion.py
            base_parameters:
              resource_type: Patient
            source: WORKSPACE
        - task_key: raw_encounter
          depends_on:
            - task_key: raw_patient
          notebook_task:
            notebook_path: /Workspace/Users/mohitag9040@gmail.com/fhir-lakehouse/src/notebooks/01_raw_ingestion.py
            base_parameters:
              resource_type: Encounter
            source: WORKSPACE
